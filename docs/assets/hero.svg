  <title id="title">Link. Card. Publish.</title>
  <desc id="desc">StonerHand workflow: a music link becomes an editable card and a Telegram publication. Turquoise sound waves on a dark background.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111B1B"/>
      <stop offset="1" stop-color="#090E10"/>
    </linearGradient>
