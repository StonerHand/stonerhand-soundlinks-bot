      <stop stop-color="#00DDB5"/>
      <stop offset="1" stop-color="#8CFFE2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="24" fill="url(#background)" stroke="#293C3A" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
