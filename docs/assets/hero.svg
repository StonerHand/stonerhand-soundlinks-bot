    <text x="52" y="144" fill="#F3FAF8" font-size="68" font-weight="700" letter-spacing="-2">Link. Card. Publish.</text>
    <text x="56" y="196" fill="#B6CCC6" font-size="27">Tracks, albums &amp; everything between.</text>
