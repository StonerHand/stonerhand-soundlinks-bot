[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stonerhand-soundlinks-bot"
version = "0.1.0"
description = "Telegram music publishing bot with universal links, collections, scheduling and channel delivery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-telegram-bot==22.8",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "pytest==9.1.1",
  "pyflakes==3.4.0",
  "ruff==0.16.2",
  "tomli==2.4.1; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
