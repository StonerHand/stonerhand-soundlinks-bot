[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stonerhand-soundlinks-bot"
version = "2.18.1"
description = "Telegram-native music publishing bot with universal release cards, collections, scheduling and channel delivery."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["telegram", "music", "bot", "songlink", "publishing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "python-telegram-bot==22.8",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "Pillow==13.0.0",
]

[project.urls]
Homepage = "https://t.me/StonerHandBot"
Repository = "https://github.com/StonerHand/stonerhand-soundlinks-bot"
Issues = "https://github.com/StonerHand/stonerhand-soundlinks-bot/issues"
Changelog = "https://github.com/StonerHand/stonerhand-soundlinks-bot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "coverage==7.17.0",
  "fakeredis[lua]==2.40.0",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "pyflakes==4.0.3",
  "ruff==0.17.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
music_links_bot = ["assets/*.png", "locales/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
# PTB 22 warns that RetryAfter.retry_after becomes a timedelta; the bot reads
# both shapes (lookup_transport._flood_safe).
filterwarnings = [
  "ignore:Deprecated since version v22.2:telegram.warnings.PTBDeprecationWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "BLE",
  "F",
  "I",
  "ISC004",
  "PERF",
  "RUF012",
  "RUF100",
  "TRY004",
  "TRY400",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
branch = true
source = ["src/music_links_bot", "api"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
