[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stonerhand-soundlinks-bot"
version = "2.6.0"
description = "Telegram-native music publishing bot with universal release cards, collections, scheduling and channel delivery."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["telegram", "music", "bot", "songlink", "publishing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "python-telegram-bot==22.8",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "Pillow==12.3.0",
]

[project.urls]
Homepage = "https://t.me/StonerHandBot"
Repository = "https://github.com/StonerHand/stonerhand-soundlinks-bot"
Issues = "https://github.com/StonerHand/stonerhand-soundlinks-bot/issues"
Changelog = "https://github.com/StonerHand/stonerhand-soundlinks-bot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "coverage==7.16.2",
  "fakeredis[lua]==2.39.0",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pyflakes==4.0.3",
  "ruff==0.17.0",
  "tomli==2.5.0; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
music_links_bot = ["assets/*.png", "locales/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "BLE",
  "F",
  "I",
  "ISC004",
  "PERF",
  "RUF012",
  "RUF100",
  "TRY004",
  "TRY400",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
branch = true
source = ["src/music_links_bot", "api"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = [
  "src/music_links_bot/draft_model.py",
  "src/music_links_bot/bot_storage.py",
  "src/music_links_bot/publication_view.py",
  "src/music_links_bot/publication_preflight.py",
  "src/music_links_bot/collection_plan.py",
  "src/music_links_bot/provider_errors.py",
  "src/music_links_bot/operation_metrics.py",
  "src/music_links_bot/url_utils.py",
  "src/music_links_bot/collection_collage.py",
  "src/music_links_bot/publication_contract.py",
  "src/music_links_bot/publication_state.py",
  "src/music_links_bot/kvstore.py",
  "src/music_links_bot/state_mutations.py",
  "src/music_links_bot/durable_state.py",
  "src/music_links_bot/user_state.py",
  "src/music_links_bot/bot_history.py",
  "src/music_links_bot/bot_crate.py",
  "src/music_links_bot/channel_templates.py",
  "src/music_links_bot/bot_preferences.py",
  "src/music_links_bot/bot_stats.py",
  "src/music_links_bot/shared_http.py",
  "src/music_links_bot/lazy_client.py",
  "src/music_links_bot/loop_runner.py",
  "src/music_links_bot/provider_runtime.py",
  "src/music_links_bot/lookup_control.py",
  "src/music_links_bot/webhook_secret.py",
  "src/music_links_bot/config.py",
  "src/music_links_bot/update_execution.py",
  "src/music_links_bot/qstash_auth.py",
  "src/music_links_bot/bot.py",
  "src/music_links_bot/alerts.py",
  "src/music_links_bot/artist.py",
  "src/music_links_bot/brand_settings.py",
  "src/music_links_bot/input_routing.py",
  "src/music_links_bot/bot_workspace.py",
  "src/music_links_bot/bot_admin.py",
  "src/music_links_bot/constants.py",
  "src/music_links_bot/bot_search_handlers.py",
  "src/music_links_bot/bot_quick_publish.py",
  "src/music_links_bot/cover_style.py",
  "src/music_links_bot/keyboards.py",
  "src/music_links_bot/formatter.py",
  "src/music_links_bot/metadata_cleaning.py",
  "src/music_links_bot/bot_lookup.py",
  "src/music_links_bot/bot_inline.py",
  "src/music_links_bot/crate_view.py",
  "src/music_links_bot/single_flight.py",
  "src/music_links_bot/search.py",
  "src/music_links_bot/musicbrainz.py",
  "src/music_links_bot/songlink.py",
]
follow_imports = "skip"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
