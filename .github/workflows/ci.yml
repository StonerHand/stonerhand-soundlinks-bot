name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Dependency consistency
        run: |
          python -m pip check
          python tests/check_dependency_pins.py
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Public repository safety
        run: |
          test -z "$(git ls-files -ci --exclude-standard)"
          ! git grep -I -n -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|[0-9]{6,}:[A-Za-z0-9_-]{30,}' -- ':!tests/**'

      - name: Lint
        run: |
          python -m pyflakes src api tests
          python -m ruff check src api tests
          python -m ruff format --check src api tests
          python -m bandit -q -r src api -x tests

      - name: Compile and deployment config
        run: |
          python -m compileall -q src api tests
          python -m json.tool vercel.json >/dev/null

      - name: Tests
        run: python -m pytest -q
        env:
          PYTHONPATH: src
