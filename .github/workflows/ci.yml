name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Repository hygiene
        run: test -z "$(git ls-files -ci --exclude-standard)"

      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes

      - name: Dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m pyflakes src api tests

      - name: Compile and deployment config
        run: |
          python -m compileall -q src api tests
          python -m json.tool vercel.json >/dev/null

      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
