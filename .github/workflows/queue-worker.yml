name: Queue worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-worker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Run the authenticated queue worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          QUEUE_BASE_URL: ${{ vars.QUEUE_BASE_URL || 'https://tg-bot-sh.vercel.app' }}
        run: python tests/e2e/queue_tick.py
